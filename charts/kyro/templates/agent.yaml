apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kyro.fullname" . }}-agent
  labels:
    {{- include "kyro.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "kyro.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "kyro.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "kyro.fullname" . }}-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ include "kyro.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "src/services/target/cluster-agent/app.py"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: MANAGEMENT_BASE_URL
              value: http://{{ include "kyro.fullname" . }}.{{ .Release.Namespace }}.svc/api
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kyro.fullname" . }}-bootstrap
                  key: AGENT_TOKEN
            - name: TARGET_CLUSTER_ID
              value: {{ .Values.agent.clusterId | quote }}
            - name: WORKSPACE_ID
              value: default
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
