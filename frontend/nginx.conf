# console — same-origin reverse proxy (docs/frontend-framework-design.md 배포 기준)
# browser 는 이 origin 하나만 본다: 정적 자산 + /api/* 프록시. token 은 cookie 로만 흐른다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
    set $api_upstream http://api-gateway.management.svc.cluster.local:8000;
    # REST — /api/* -> api-gateway (경로와 query string 보존)
    location /api/ {
        # 변수 기반 proxy_pass에 고정 URI(`/`)를 붙이면 원래 요청 경로가
        # 사라지고 모든 요청이 gateway `/`로 전달된다.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Kyro-Internal-Auth "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 빌드 자산은 해시 파일명 — 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA entry 는 chunk manifest 역할을 하므로 배포마다 새로 받아야 한다.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # Never disguise a retired HTML entry point as the product home page.
    location ~* [.]html$ {
        return 404;
    }

    location = / {
        expires -1;
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # SPA fallback
    location / {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
