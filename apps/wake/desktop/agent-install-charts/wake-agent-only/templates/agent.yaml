apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wake-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: wake-agent
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: wake-agent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: wake-agent
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: wake-agent
      # 모든 Node에서 heartbeat: control plane처럼 taint가 있는 Node도 포함
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ include "candidate.image" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: WAKE_CLUSTER_ID
              value: {{ .Values.identity.clusterId | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
